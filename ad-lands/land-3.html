<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land 3 - Countdown</title>
<style>
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body { font-family: -apple-system, system-ui, sans-serif; background: linear-gradient(180deg,#ff512f,#dd2476); color: #fff;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); gap: 20px; }
.badge { font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 6px 14px; border-radius: 999px; background: #fff; color: #dd2476; }
h1 { font-size: 34px; line-height: 1.15; max-width: 480px; }
p { font-size: 17px; line-height: 1.45; opacity: .8; max-width: 420px; }
.big { font-size: 72px; font-weight: 800; color: #fff; line-height: 1; }
.cta { display: block; width: 100%; max-width: 420px; padding: 18px; border-radius: 16px; font-size: 19px;

<body>
<span class="badge">Last chance</span>
<h1>Offer ends in <span id="t">15:00</span></h1>
<p>Sample landing 3 of 3, the last one in the list.</p>
<a class="cta" href="track.html?to=final.html%3Ffrom%3Dland-3">Claim now</a>
<small>Sample ad landing 3 - OrbitTap test content</small>
<script>
let s = 900;
setInterval(() => { s = Math.max(0, s - 1); document.getElementById('t').textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }, 1000);
</script>
</body>
